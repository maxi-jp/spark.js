<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spark.js - Physics Car Game</title>
    
    <!-- Load engine and physics dependencies -->
    <script src="src/engine/utils_math.js"></script>
    <script src="src/engine/utils_classes.js"></script>
    <script src="src/engine/renderer.js"></script>
    <script src="src/engine/gameobjects.js"></script>
    <script src="src/engine/input.js"></script>
    <script src="src/engine/audioplayer.js"></script>
    <script src="src/engine/htmlmenu.js"></script>
    <script src="src/engine/game.js"></script>
    
    <!-- Load Box2D Physics -->
    <script src="src/lib/Box2D.js"></script>
    <script src="src/engine/box2d_helper.js"></script>
    <script src="src/engine/box2d_game.js"></script>
    <script src="src/engine/box2d_gameobjects.js"></script>
    <script src="src/engine/main.js"></script>
    
    <!-- Load our game logic -->
    <script src="src/examples/box2d/box2d_cargame.js"></script>
    
    <style>
        body {
            background: #222;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            position: relative;
            width: 1300px;
            height: 600px;
            margin: 0 auto;
            background: #e0f7fa; /* Fallback light blue sky */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        a {
            color: lightskyblue;
        }
        .progressbar {
            position: absolute;
            top: 20px; left: 20px; width: 300px; height: 30px;
            background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 15px; overflow: hidden;
        }
        .fuel-value { width: 100%; height: 100%; background: #4caf50; transition: width 0.1s linear; }
        #level { position: absolute; top: 20px; right: 20px; font-size: 28px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h2>Physics Car Game (spark.js port of <a href="https://github.com/makzan/HTML5-Games-Examples">Thomas Seng Hin Mak's "Box2D Car Game"</a>)</h2>
    <p>Left/Right arrows (or A/D) to drive. 'R' to restart the level. Get the car to the rightmost green goal!</p>
    
    <section id="game-container">
        <canvas id="game" width="1300" height="600"></canvas>
        
        <div id="ui-layer">
            <div id="fuel" class="progressbar">
                <div id="fuel-value" class="fuel-value"></div>
            </div>
            <div id="level">Level 1</div>
        </div>
    </section>
</body>
</html>
