<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spark.js - Twin Stick Shooter (complex edition)</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />    
    <link rel="stylesheet" href="css/style.css">    
    <link rel="stylesheet" href="./src/examples/tts/fonts/aircruiserlaserital.ttf">
    <link rel="stylesheet" href="./src/examples/tts/style.css">
    <link rel="stylesheet" href="./src/examples/tts/logo.css">
    <!-- spark.js engine scripts -->
    <script src="src/engine/utils_math.js"></script>
    <script src="src/engine/utils_classes.js"></script>
    <script src="src/engine/renderer.js"></script>
    <script src="src/engine/gameobjects.js"></script>
    <script src="src/engine/input.js"></script>
    <script src="src/engine/virtualcontrols.js"></script>
    <script src="src/engine/audioplayer.js"></script>
    <script src="src/engine/htmlmenu.js"></script>
    <script src="src/engine/game.js"></script>
    <script src="src/engine/fsm.js"></script>
    <script src="src/engine/main.js"></script>
    <!-- TTS game scripts -->
    <script src="src/examples/tts/tts-complex_player.js"></script>
    <script src="src/examples/tts/tts-complex_menus.js"></script>
    <script src="src/examples/tts/tts_enemies.js"></script>
    <script src="src/examples/tts/tts_bullet.js"></script>    
    <script src="src/examples/tts/tts-complex_level1.js"></script>    
    <script src="src/examples/tts/tts-complex.js"></script>
</head>
<body>
    <div id="container">
        <!-- game canvas -->
        <canvas id="myCanvas" width="640" height="480"></canvas>

        <!-- UI - main menu -->
        <div id="mainMenu">
            <!-- Scanlines -->
            <div class="scan-lines"></div>

            <div id="press-to-start" class="gradient-multicolor-bg" title="Press to start!">Press to start!</div>

            <div class="neon-logo hidden">
                <!-- Background Triangle -->
                <svg class="triangle" viewBox="0 0 1000 700">
                    <defs>
                        <!-- gradientUnits to make rotation math perfectly centered -->
                        <linearGradient id="triangleGradient"
                                        x1="0%" y1="0%" x2="100%" y2="0%"
                                        gradientUnits="objectBoundingBox">
                            <stop offset="0%" stop-color="#36dfff"/>
                            <stop offset="50%" stop-color="#6d5cff"/>
                            <stop offset="100%" stop-color="#ff39dc"/>
                            
                            <!-- 360-degree rotation -->
                            <animateTransform 
                                attributeName="gradientTransform" 
                                type="rotate" 
                                from="0 0.5 0.5" 
                                to="360 0.5 0.5" 
                                dur="10s" 
                                repeatCount="indefinite" 
                            />
                        </linearGradient>
                    </defs>
                    <polygon points="40,40 960,40 500,660"/>
                </svg>

                <!-- Main Title -->
                <div class="title">

                    <!-- Main text -->
                    <div class="title-outline" aria-hidden="true">
                        <span>NEON</span>
                        <div class="strike-wrapper">
                            <span class="outline-s">S</span>
                            <span>TRIKE</span>
                        </div>
                    </div>

                    <h1 class="logo-text">
                        <span title="NEON" class="gradient-multicolor-bg">NEON</span>
                        <div class="strike-wrapper">
                            <span title="S" class="strike-s gradient-multicolor-bg">S</span>
                            <span title="TRIKE" class="gradient-multicolor-bg">TRIKE</span>
                        </div>
                    </h1>

                    <!-- Chrome reflection -->
                    <div class="reflection"></div>

                    <!-- Neon bloom -->
                    <div class="bloom"></div>

                    <!-- Lens flares -->
                    <div class="flares">
                        <span class="flare flare-1"></span>
                        <span class="flare flare-2"></span>
                        <span class="flare flare-3"></span>
                        <span class="flare flare-4"></span>
                    </div>
                </div>

                <!-- Subtitle -->
                <div class="subtitle">
                    ARCADE SHOOTER
                </div>

                <div id="press-to-start-2" class="gradient-multicolor-bg hidden" title="Press again!">Press again!</div>
            </div>

            <!-- <h1>Twin Stick Shooter</h1>
            <h2>move'n'shoot</h2>
            <div class="menuButton" id="menuStart">Start</div> -->
        </div>

        <!-- UI - pause menu -->
        <div id="pauseMenu" class="hidden" width="320" height="240">
            <h1>Game Paused</h1>
            <div class="menuButton" id="menuResume">Resume</div>
        </div>

        <!-- ingame UI -->
        <div id="ingameUI" class="hidden"></div>

        <!-- UI - Game Over -->
        <!-- Game Over Menu -->
        <div id="gameOverMenu" class="hidden">
            <h1>GAME OVER</h1>
            <div class="score-display">
                <h2>Final Score</h2>
                <p id="finalScore">0</p>
            </div>
            <div id="btnRestart" class="menuButton">Play Again</div>
        </div>
    </div>
</body>
</html>
